<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>THE FORBIDDEN CHECKMATE</title>

  <link rel="stylesheet" href="style.css">

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"
    defer>
  </script>

  <script src="script.js" defer></script>
</head>

<body>

  <header class="header">
    <h1>♛ THE FORBIDDEN CHECKMATE ♛</h1>
    <p class="subtitle">ENTER THE WORLD OF STRATEGY</p>
  </header>

  <main class="game-container">

    <section class="game-info">
      <h2>THE ROYAL BATTLE</h2>

      <div class="status-box">
        <span class="status-label">GAME STATUS</span>
        <p id="message" aria-live="polite">Preparing the chessboard...</p>
      </div>

      <div class="turn-box">
        <span class="status-label">CURRENT TURN</span>
        <p id="turn">White</p>
      </div>
    </section>

    <section class="board-section">
      <div class="board-frame">
        <div id="board" aria-label="Chessboard"></div>
      </div>

      <div class="game-controls">
        <button id="resetBtn" type="button">↻ NEW GAME</button>
        <button id="undoBtn" type="button">↶ UNDO MOVE</button>
      </div>
    </section>

    <section class="move-section">
      <h2>♜ BATTLE LOG ♜</h2>
      <div id="moveHistory">
        <p class="empty-history">Your moves will appear here...</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>EVERY MOVE HAS A CONSEQUENCE</p>
    <p class="copyright">THE FORBIDDEN CHECKMATE © 2026</p>
  </footer>

</body>
</html>
